<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Johan Ahlehjelm</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0d0f12;--text:#f1f0ec;--muted:#a8a8a3;--line:#2b2e34;--accent:#c8d8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;
background:radial-gradient(800px 500px at 88% 8%,rgba(94,122,180,.12),transparent 62%),var(--bg);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,520px)}
p.code{margin:0 0 22px;color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1;letter-spacing:-.04em}
p.lead{margin:22px 0 34px;color:var(--muted);line-height:1.7}
a{display:inline-block;padding:13px 22px;border:1px solid var(--line);border-radius:999px;color:var(--text);text-decoration:none;font-size:.9rem;transition:border-color .2s ease}
a:hover,a:focus-visible{border-color:var(--accent);outline:none}
</style>
</head>
<body>
<main>
<p class="code">Error 404</p>
<h1>This page doesn’t exist</h1>
<p class="lead">The address may have changed, or the link that brought you here is out of date.</p>
<a href="/">Back to the homepage</a>
</main>
</body>
</html>
